    decision_time: "14:00 Pacific/Auckland"
    calendar_match: "^RBNZ Interest Rate Decision$"
    manual: {rate: 2.75, last_change: 2026-09-02, last_change_bp: 25}
    meetings: [2026-02-18, 2026-04-08, 2026-05-27, 2026-07-08, 2026-09-02, 2026-10-28, 2026-12-09]

  - id: pboc
    name: People's Bank of China

name: Update dashboard (every 15 min)

# Rebuilds the page every 15 minutes on weekdays, 06:00-23:00 Dublin time:
# latest closes, live intraday quotes, policy rates, the economic calendar
# (actuals, surprises, market reactions) and headlines.
#
# GitHub cron runs in UTC, so the schedule covers 04:00-22:45 UTC (both summer
# and winter) and the first step skips runs outside 06:00-23:00 Dublin.
# Scheduled runs can start 5-20 minutes late when GitHub is busy.
on:
  schedule:
    - cron: "*/15 4-22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Skip outside 06:00-23:00 Dublin
        id: window
        run: |
          h=$(TZ=Europe/Dublin date +%-H)
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$h" -lt 6 ] || [ "$h" -ge 23 ]; }; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Outside the Dublin window (hour $h); skipping."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.window.outputs.run == 'true'
        uses: actions/checkout@v4

      - if: steps.window.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - if: steps.window.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Build dashboard
        if: steps.window.outputs.run == 'true'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python build.py

      # Only history, calendar actuals and the cached summary are committed, and
      # only when they change (new closes, new figures), not on every run.
      - name: Commit updated data
        if: steps.window.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -m "data: update $(TZ=Europe/Dublin date '+%F %H:%M')"
          git pull --rebase
          git push

      - if: steps.window.outputs.run == 'true'
        uses: actions/configure-pages@v5
      - if: steps.window.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        if: steps.window.outputs.run == 'true'
        uses: actions/deploy-pages@v4
